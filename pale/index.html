<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut">
<meta name="theme-color" content="#111214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scheda">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>Scheda Edo</title>
<style>
:root{--bg:#111214;--card:#1b1d21;--line:#2a2d33;--txt:#ecedef;--mut:#8b9099;--acc:#c6f135;--acc2:#3a4a10;--bad:#ff6b5b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) 0 calc(90px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;background:var(--bg);z-index:5;padding:12px 16px 8px;border-bottom:1px solid var(--line)}
h1{margin:0 0 8px;font-size:20px;letter-spacing:-.02em}
h1 small{color:var(--mut);font-weight:400;font-size:13px;margin-left:6px}
.tabs{display:flex;gap:6px;overflow-x:auto}
.tabs button{flex:1;min-width:52px;padding:8px 0;border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:10px;font:600 13px inherit}
.tabs button.on{background:var(--acc);color:#111;border-color:var(--acc)}
main{padding:12px 16px}
.focus{color:var(--mut);margin:2px 0 12px;font-size:13px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.ex h3{margin:0;font-size:15px}
.meta{color:var(--mut);font-size:12px;margin:2px 0 8px;display:flex;justify-content:space-between;gap:8px}
.last{color:var(--acc);font-size:12px;margin-bottom:8px}
.sets{display:grid;grid-template-columns:22px 1fr 1fr;gap:6px;align-items:center}
.sets span{color:var(--mut);font-size:12px;text-align:center}
.sets .hd{font-size:11px;text-transform:uppercase;letter-spacing:.05em}
input{width:100%;padding:10px 8px;border-radius:9px;border:1px solid var(--line);background:#121316;color:var(--txt);font:600 16px inherit;text-align:center}
input:focus{outline:none;border-color:var(--acc)}
input.done{border-color:var(--acc2);background:#171c0c}
.note{margin-top:8px;font-size:14px;text-align:left;font-weight:400}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);display:flex;gap:8px}
.bar button{flex:1;padding:14px;border-radius:12px;border:0;font:700 15px inherit}
.p{background:var(--acc);color:#111}.s{background:var(--card);color:var(--txt);border:1px solid var(--line)!important}
.list .row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.list .row b{font-weight:600}.mut{color:var(--mut)}
select{width:100%;padding:10px;border-radius:9px;background:var(--card);color:var(--txt);border:1px solid var(--line);font:15px inherit;margin-bottom:10px}
svg text{fill:var(--mut);font-size:10px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--acc);color:#111;padding:10px 16px;border-radius:20px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
.danger{color:var(--bad);background:none;border:0;font:14px inherit;padding:12px 0}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
summary{font-weight:600}
</style>
</head>
<body>
<header>
  <h1>Scheda <small id="sub"></small></h1>
  <div class="tabs" id="tabs"></div>
</header>
<main id="main"></main>
<div class="bar" id="bar"></div>
<div class="toast" id="toast"></div>

<script>
const PLAN = {
  lun:{n:"Lun",f:"Push + Core A",ex:[
    ["panca","Panca piana bilanciere",4,"5–7","2'30\""],["dip","Dip zavorrati",4,"6–8","2'"],
    ["military","Military press in piedi",3,"6–8","2'"],["hspu","Pike push-up / HSPU al muro",3,"6–10","90\""],
    ["inclinata","Panca inclinata manubri",3,"8–12","90\""],["laterali_c","Alzate laterali ai cavi",4,"12–15","60\""],
    ["pushdown","Pushdown tricipiti ai cavi",3,"10–15","60\""],
    ["hlr","Core A · Hanging leg raise",4,"8–12","60\""],["crunch","Core A · Crunch ai cavi",3,"10–15","60\""],["wheel","Core A · Ab wheel",3,"8–12","60\""]]},
  mar:{n:"Mar",f:"Pull + Core B",ex:[
    ["trazioni","Trazioni zavorrate prona",4,"5–7","2'30\""],["rematore","Rematore bilanciere",4,"6–8","2'"],
    ["fl","Front lever (tuck → adv.) · secondi",5,"8–12\"","90\""],["lat","Lat machine presa stretta",3,"8–12","90\""],
    ["rem_cavo","Rematore cavo 1 braccio",3,"10–12","60\""],["facepull","Face pull",3,"15","60\""],
    ["curl","Curl bilanciere",3,"8–12","60\""],["hammer","Curl a martello",3,"8–12","60\""],
    ["lsit","Core B · L-sit · secondi",5,"10–20\"","45\""],["pallof","Core B · Pallof / woodchopper",3,"12/lato","45\""],
    ["dragon","Core B · Dragon flag negativi",3,"4–6","90\""],["plank","Core B · Side/copenhagen plank · sec",2,"30\"/lato","30\""]]},
  mer:{n:"Mer",f:"Gambe pesante + Core A",ex:[
    ["squat","Back squat",4,"5–7","3'"],["rdl","Stacco rumeno",3,"6–8","2'30\""],
    ["bulgari","Affondi bulgari manubri",3,"8–10/gamba","90\""],["legcurl","Leg curl",3,"10–12","60\""],
    ["calf","Calf raise in piedi",4,"10–15","60\""],
    ["hlr","Core A · Hanging leg raise",4,"8–12","60\""],["crunch","Core A · Crunch ai cavi",3,"10–15","60\""],["wheel","Core A · Ab wheel",3,"8–12","60\""]]},
  ven:{n:"Ven",f:"Skill + volume + Core B",ex:[
    ["hs","Handstand · secondi migliori",3,"20–45\"","—"],["mu","Muscle-up / progressione",5,"3–5","2'"],
    ["planche","Planche lean / tuck · secondi",5,"10–15\"","90\""],["chin","Chin-up (SS)",3,"max−2","—"],
    ["archer","Push-up arcieri (SS)",3,"8/lato","90\""],["ringrow","Ring row (SS)",3,"10–12","—"],
    ["ringdip","Dip agli anelli (SS)",3,"8–10","90\""],["laterali_m","Alzate laterali manubri",3,"15–20","60\""],
    ["lsit","Core B · L-sit · secondi",5,"10–20\"","45\""],["pallof","Core B · Pallof / woodchopper",3,"12/lato","45\""],
    ["dragon","Core B · Dragon flag negativi",3,"4–6","90\""],["plank","Core B · Side/copenhagen plank · sec",2,"30\"/lato","30\""]]},
  sab:{n:"Sab",f:"Posteriore + condizionamento + Core A",ex:[
    ["stacco","Stacco da terra",4,"4–6","3'"],["hipthrust","Hip thrust bilanciere",3,"8–10","2'"],
    ["legpress","Leg press / front squat",3,"10–12","90\""],["nordic","Nordic curl assistito",3,"5–8","90\""],
    ["finisher","Finisher 20\" sprint / 40\" lento · round",1,"8 round","—"],
    ["hlr","Core A · Hanging leg raise",4,"8–12","60\""],["crunch","Core A · Crunch ai cavi",3,"10–15","60\""],["wheel","Core A · Ab wheel",3,"8–12","60\""]]}
};
const MAIN_LIFTS = ["panca","dip","trazioni","squat","stacco","rematore","military","rdl"];
const KEY="scheda.v1";
const store=(()=>{try{const s=JSON.parse(localStorage.getItem(KEY));return s&&s.sessions?s:{sessions:[],drafts:{}}}catch(e){return{sessions:[],drafts:{}}}})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){toast("Errore salvataggio")}};
const dayKeys=Object.keys(PLAN);
const todayKey=()=>({1:"lun",2:"mar",3:"mer",5:"ven",6:"sab"})[new Date().getDay()]||"lun";
let view={tab:todayKey()};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1600)}
function lastFor(id){for(let i=store.sessions.length-1;i>=0;i--){const e=store.sessions[i].entries[id];if(e&&e.some(s=>s.kg!==""||s.r!==""))return{date:store.sessions[i].date,sets:e}}return null}
const fmtSet=s=>(s.kg!==""?(s.kg>0?"+":"")+s.kg+"kg":"")+(s.kg!==""&&s.r!==""?"×":"")+(s.r!==""?s.r:"");
const fmtDate=d=>new Date(d).toLocaleDateString("it-IT",{day:"numeric",month:"short"});

function renderTabs(){
  $("#tabs").innerHTML=[...dayKeys.map(k=>[k,PLAN[k].n]),["storico","Storico"],["grafici","Grafici"]]
    .map(([k,n])=>`<button class="${view.tab===k?"on":""}" data-t="${k}">${n}</button>`).join("");
  $("#tabs").onclick=e=>{const t=e.target.dataset.t;if(t){view.tab=t;render()}};
}
function getDraft(k){
  if(!store.drafts[k]){const d={};PLAN[k].ex.forEach(([id,,n])=>d[id]=Array.from({length:n},()=>({kg:"",r:""})));d._note="";store.drafts[k]=d}
  return store.drafts[k];
}
function renderDay(k){
  const p=PLAN[k],d=getDraft(k);
  $("#sub").textContent=p.f;
  $("#main").innerHTML=`<p class="focus">Kg = zavorra o carico (corpo libero: lascia vuoto). Rip = ripetizioni o secondi.</p>`+
  p.ex.map(([id,name,n,rr,rec])=>{
    const l=lastFor(id);
    return `<div class="ex"><h3>${esc(name)}</h3><div class="meta"><span>${n} × ${esc(rr)}</span><span>rec. ${esc(rec)}</span></div>
    ${l?`<div class="last">Ultima (${fmtDate(l.date)}): ${l.sets.filter(s=>s.kg!==""||s.r!=="").map(fmtSet).join(" · ")}</div>`:""}
    <div class="sets"><span></span><span class="hd">kg</span><span class="hd">rip</span>
    ${d[id].map((s,i)=>`<span>${i+1}</span>
      <input inputmode="decimal" data-id="${id}" data-i="${i}" data-f="kg" value="${esc(s.kg)}" placeholder="${l&&l.sets[i]?esc(l.sets[i].kg):""}" class="${s.kg!==""?"done":""}">
      <input inputmode="numeric" data-id="${id}" data-i="${i}" data-f="r" value="${esc(s.r)}" placeholder="${l&&l.sets[i]?esc(l.sets[i].r):""}" class="${s.r!==""?"done":""}">`).join("")}
    </div></div>`}).join("")+
  `<div class="ex"><h3>Note</h3><input class="note" data-note="1" value="${esc(d._note)}" placeholder="Sensazioni, dolori, sonno…"></div>`;
  $("#main").oninput=e=>{
    const t=e.target;
    if(t.dataset.note){d._note=t.value}else if(t.dataset.id){
      const v=t.value.replace(",",".").trim();d[t.dataset.id][+t.dataset.i][t.dataset.f]=v===""?"":(isNaN(+v)?v:+v);
      t.classList.toggle("done",v!=="")}
    save();
  };
  $("#bar").innerHTML=`<button class="s" id="clr">Svuota</button><button class="p" id="sv">Salva allenamento</button>`;
  $("#sv").onclick=()=>{
    const filled=Object.entries(d).some(([id,v])=>id!=="_note"&&v.some(s=>s.kg!==""||s.r!==""));
    if(!filled){toast("Niente da salvare");return}
    const entries={};Object.keys(d).forEach(id=>{if(id!=="_note")entries[id]=d[id]});
    store.sessions.push({date:new Date().toISOString(),day:k,entries,note:d._note});
    delete store.drafts[k];save();toast("Salvato ✓");render();
  };
  $("#clr").onclick=()=>{if(confirm("Svuotare i campi di oggi?")){delete store.drafts[k];save();render()}};
}
function nameOf(id){for(const k of dayKeys){const e=PLAN[k].ex.find(x=>x[0]===id);if(e)return e[1]}return id}
function renderHistory(){
  $("#sub").textContent=store.sessions.length+" allenamenti";
  const s=[...store.sessions].reverse();
  $("#main").innerHTML=(s.length?s.map((x,ri)=>`<details><summary>${fmtDate(x.date)} · ${PLAN[x.day].f}</summary>
    <div class="list">${Object.entries(x.entries).filter(([,v])=>v.some(t=>t.kg!==""||t.r!=="")).map(([id,v])=>
      `<div class="row"><span>${esc(nameOf(id))}</span><b>${v.filter(t=>t.kg!==""||t.r!=="").map(fmtSet).join(" · ")}</b></div>`).join("")}
    ${x.note?`<div class="row mut">${esc(x.note)}</div>`:""}</div>
    <button class="danger" data-del="${store.sessions.length-1-ri}">Elimina</button></details>`).join(""):`<p class="mut">Ancora nessun allenamento salvato.</p>`);
  $("#main").onclick=e=>{const i=e.target.dataset.del;if(i!==undefined&&confirm("Eliminare questo allenamento?")){store.sessions.splice(+i,1);save();render()}};
  $("#bar").innerHTML=`<button class="s" id="imp">Importa backup</button><button class="p" id="exp">Esporta backup</button>`;
  $("#exp").onclick=()=>{
    const blob=new Blob([JSON.stringify(store,null,1)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="scheda-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();
  };
  $("#imp").onclick=()=>{const f=document.createElement("input");f.type="file";f.accept=".json,application/json";
    f.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.sessions)throw 0;
      if(confirm(`Sostituire i dati con il backup (${d.sessions.length} allenamenti)?`)){store.sessions=d.sessions;store.drafts=d.drafts||{};save();render();toast("Backup importato")}}catch(e){toast("File non valido")}};r.readAsText(f.files[0])};f.click()};
}
function series(id){
  return store.sessions.map(s=>{const v=(s.entries[id]||[]).filter(t=>t.r!==""&&!isNaN(+t.r));if(!v.length)return null;
    const best=Math.max(...v.map(t=>(+t.kg||0)*(1+(+t.r)/30)));const top=Math.max(...v.map(t=>+t.kg||0));
    return{d:s.date,top,e1rm:best,reps:Math.max(...v.map(t=>+t.r))}}).filter(Boolean);
}
function chart(pts,key,unit){
  if(pts.length<2)return `<p class="mut">Servono almeno 2 allenamenti per il grafico.</p>`;
  const W=340,H=150,P=28,ys=pts.map(p=>p[key]),mn=Math.min(...ys),mx=Math.max(...ys),rg=(mx-mn)||1;
  const X=i=>P+i*(W-P-8)/(pts.length-1),Y=v=>H-20-(v-mn)/rg*(H-40);
  const path=pts.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p[key]).toFixed(1)).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">
    <line x1="${P}" x2="${W-8}" y1="${H-20}" y2="${H-20}" stroke="#2a2d33"/>
    <text x="2" y="${Y(mx)+3}">${Math.round(mx*10)/10}</text><text x="2" y="${Y(mn)+3}">${Math.round(mn*10)/10}</text>
    <path d="${path}" fill="none" stroke="#c6f135" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p[key])}" r="3.5" fill="#c6f135"/>`).join("")}
    <text x="${P}" y="${H-4}">${fmtDate(pts[0].d)}</text><text x="${W-8}" y="${H-4}" text-anchor="end">${fmtDate(pts[pts.length-1].d)}</text>
  </svg><p class="mut" style="font-size:12px;margin:4px 0 0">${unit}</p>`;
}
function renderCharts(){
  $("#sub").textContent="Progressi";
  const all=[...new Set(dayKeys.flatMap(k=>PLAN[k].ex.map(e=>e[0])))];
  view.ex=view.ex||"trazioni";
  const pts=series(view.ex);const weighted=MAIN_LIFTS.includes(view.ex)||pts.some(p=>p.top>0);
  $("#main").innerHTML=`<select id="exs">${all.map(id=>`<option value="${id}" ${id===view.ex?"selected":""}>${esc(nameOf(id))}</option>`).join("")}</select>
   <div class="ex">${weighted?chart(pts,"e1rm","Forza stimata (kg di carico, formula di Epley sulla serie migliore)"):chart(pts,"reps","Ripetizioni / secondi migliori")}</div>
   ${pts.length?`<div class="ex list">${[...pts].reverse().slice(0,8).map(p=>`<div class="row"><span>${fmtDate(p.d)}</span><b>${weighted?"top +"+p.top+" kg":p.reps}</b></div>`).join("")}</div>`:""}`;
  $("#exs").onchange=e=>{view.ex=e.target.value;render()};
  $("#bar").innerHTML="";
}
function render(){renderTabs();window.scrollTo(0,0);
  if(view.tab==="storico")renderHistory();else if(view.tab==="grafici")renderCharts();else renderDay(view.tab)}
render();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
